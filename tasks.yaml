# Collection tasks for scripts/collect.py. Goals may use {date+N}, {date+N:strftime}, and {weekday+N}.

- id: flights-zurich-london
  url: https://www.google.com/travel/flights?hl=en&gl=US&curr=USD
  goal: "Find one-way flights from Zurich to London on {date+14}, for one adult in economy. Stop when matching flight options are visible. Do not select or book a flight."
  tags: [google_flights, one_way]
  verify: flights
  verify_args: {origin: "Zürich", destination: "London", date: "{date+14:%Y-%m-%d}", one_way: true, adults: 1}
